# The FULL stack — MongoDB, IB Gateway, the collector and the dashboard.
#
# This is for running and debugging the whole thing locally in containers,
# which is the only honest way to find out whether the cloud topology works
# before paying for it. Railway does not read this file: there each of these
# is its own service. The env var wiring below is what has to be reproduced
# in Railway's Variables UI.
#
#   cd deploy && docker compose up
#
# Credentials come from deploy/.env (gitignored — see .env.example). Never put
# them in this file.

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      # 27018, not 27017: a laptop running the stack natively already has mongod
      # on 27017, and quietly connecting to the wrong database is a bad hour.
      # Host-side debugging only — the other services use the compose network.
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    # Headless IB Gateway: Java + Xvfb + IBC, which handles the login and the
    # daily restart. Gateway has no headless mode of its own.
    #
    # Built rather than pulled, for a one-line patch that makes the API socket
    # dual-stack — see Dockerfile.gateway. Compose would work without it;
    # Railway's IPv6-only private network would not. Building it here means
    # what gets tested locally is what gets deployed.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      # TRADING_MODE picks which account AND which API port Gateway listens on:
      #   paper -> 4002      live -> 4001
      # Paper is strongly preferred for an unattended deployment: a live login
      # requires 2FA approval on a phone, and Gateway restarts daily, so a live
      # deployment stops collecting every day until someone taps the prompt.
      # Paper receives the identical real-time feed once "Share real-time market
      # data with paper account" is enabled in Client Portal.
      TRADING_MODE: ${TRADING_MODE:-paper}
      # LEFT side = the names this image demands; RIGHT side = ours.
      # The image is IB Gateway, but its variables are called TWS_* because it
      # drives IBC, which supports Gateway and TWS through one set of names.
      # Reading "TWS_USERID" while running Gateway is confusing enough to make
      # people think they configured the wrong thing, so deploy/.env uses
      # IB_USERNAME / IB_PASSWORD and the mapping happens here, once.
      TWS_USERID: ${IB_USERNAME:?set IB_USERNAME in deploy/.env}
      TWS_PASSWORD: ${IB_PASSWORD:?set IB_PASSWORD in deploy/.env}
      # IBKR allows ONE session per account. When it finds another one it pops
      # an "Existing session detected" dialog, and IBC's default for that is
      # `manual` — meaning it waits for a human to click, forever, on a
      # headless container with no screen. Gateway then never finishes logging
      # in and never opens the API port, so the collector just gets connection
      # refused with nothing in ITS log to explain why. `primary` makes this
      # session take over and stay taken: a later session cannot displace it.
      # Set `primaryoverride` instead if you want to be able to grab the feed
      # back from a local Gateway while the deployment is running.
      EXISTING_SESSION_DETECTED_ACTION: ${EXISTING_SESSION_DETECTED_ACTION:-primary}
      # Gateway binds its API to loopback only and keeps TrustedIPs=127.0.0.1;
      # the image bridges that with socat, so every connection Gateway sees
      # really does come from 127.0.0.1 and no other container needs trusting.
      # Kept because a future image version may stop using socat.
      TRUSTED_IPS: ${TRUSTED_IPS:-0.0.0.0/0}
      READ_ONLY_API: ${READ_ONLY_API:-yes}
      TZ: America/New_York
    ports:
      # 4004/4003, NOT 4002/4001. Gateway binds its own API port (4002 paper,
      # 4001 live) to loopback, so nothing outside the container can reach it;
      # the image runs socat to republish it on API_PORT+2 — 4004 for paper,
      # 4003 for live. Publishing 4002 here just forwards to a socket Gateway
      # will not answer, which shows up as an API handshake timeout rather
      # than a refused connection, so it looks like a Gateway fault.
      # Host-side only: the collector uses the compose network, not these.
      - "127.0.0.1:4004:4004"
      - "127.0.0.1:4003:4003"

  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collector
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      MONGO_URI: mongodb://mongo:27017/
      # THE reason ibkr/*.py stopped hardcoding 127.0.0.1: here Gateway is a
      # different container, and loopback would be the collector itself.
      IB_HOST: gateway
      # The collector needs FinViz too, not just the app. Its i1 refresh worker
      # keeps a consolidated-volume reference for every COLLECTED ticker, while
      # the app only fetches the one being VIEWED — so without these, a ticker
      # that is collected but not on screen accumulates tick buckets that can
      # never be scaled to real volume.
      FINVIZ_USERNAME: ${FINVIZ_USERNAME:-}
      FINVIZ_PASSWORD: ${FINVIZ_PASSWORD:-}
    command: >
      python -m ibkr.dynamic_collector
      --port ${IB_API_PORT:-4004}
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/
      PORT: "8050"
      # The collector is filling this database with live data, so do not
      # overwrite it with the fixed demo day.
      DEMO_SEED: "0"
      FINVIZ_USERNAME: ${FINVIZ_USERNAME:-}
      FINVIZ_PASSWORD: ${FINVIZ_PASSWORD:-}
    ports:
      - "8050:8050"
    restart: unless-stopped

volumes:
  mongo_data:
